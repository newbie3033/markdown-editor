changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: ✨ 新功能
      labels:
        - enhancement
        - feature
    - title: 🐛 问题修复
      labels:
        - bug
        - fix
    - title: 📚 文档
      labels:
        - documentation
        - docs
    - title: 📦 依赖更新
      labels:
        - dependencies
    - title: 🔧 其他更改
      labels:
        - '*'
