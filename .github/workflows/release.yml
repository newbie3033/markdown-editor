name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep all build caches inside the workspace, matching electron-builder.yml
  # and the project's self-contained build setup.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            script: build:linux
          - platform: windows-x64
            runner: windows-latest
            script: build:win
          # macos-15 is Apple Silicon; macos-15-intel is the Intel runner.
          - platform: macos-arm64
            runner: macos-15
            script: build:mac
          - platform: macos-x64
            runner: macos-15-intel
            script: build:mac

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # build/icon.png is tracked with Git LFS; the raw pointer is not a
          # valid input for electron-builder's Windows icon converter.
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set package version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic versioning, for example v1.2.3 or v1.2.3-beta.1: $TAG_NAME" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Verify build icon
        run: node -e "const fs = require('fs'); const icon = fs.readFileSync('build/icon.png'); if (icon.readUInt32BE(0) !== 0x89504e47 || icon.readUInt32BE(4) !== 0x0d0a1a0a) throw new Error('build/icon.png is not a hydrated PNG file');"

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/InkMark-*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/InkMark-*)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release files were downloaded.' >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/InkMark-*)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "InkMark $TAG_NAME" \
              --generate-notes
          fi
