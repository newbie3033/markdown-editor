<svg xmlns="http://www.w3.org/2000/svg" width="168" height="46" viewBox="0 0 168 46">
  <style>
    svg { color: #176d62; --paper: #eaf6f1; --line: #6baf9e }
    @media (prefers-color-scheme: dark) {
      svg { color: #9cdecd; --paper: #18352f; --line: #589e8d }
    }
    @media (prefers-reduced-motion: no-preference) {
      .branch { animation: draw 1.3s .3s both }
      .nodes { animation: appear .7s 1.5s both }
    }
    @keyframes draw { from { stroke-dashoffset: 1 } }
    @keyframes appear { from { opacity: .15 } }
  </style>
  <rect x="1" y="3" width="66" height="40" rx="6" fill="var(--paper)"/>
  <g fill="currentColor" font-family="monospace" font-size="12">
    <text x="9" y="19">A--&gt;B</text>
    <text x="9" y="34">A--&gt;C</text>
  </g>
  <g fill="none" stroke="var(--line)" stroke-width="2">
    <path class="branch" d="M96 23h17q5 0 5-5v-2q0-5 5-5h16" pathLength="1" stroke-dasharray="1"/>
    <path class="branch" d="M96 23h17q5 0 5 5v2q0 5 5 5h16" pathLength="1" stroke-dasharray="1"/>
  </g>
  <g fill="var(--paper)" stroke="var(--line)">
    <rect x="78" y="14" width="20" height="18" rx="4"/>
    <g class="nodes">
      <rect x="140" y="2" width="22" height="18" rx="4"/>
      <rect x="140" y="26" width="22" height="18" rx="4"/>
    </g>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600">
    <text x="88" y="27">A</text>
    <g class="nodes"><text x="151" y="15">B</text><text x="151" y="39">C</text></g>
  </g>
</svg>
